version = 1

# The site build, the checker and the repository files came from Zakkaus/doona and keep its licence.
[[annotations]]
path = ["*", ".github/**", "site/**", "tools/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "doona contributors"
SPDX-License-Identifier = "GPL-3.0-only"

# The pages are documentation, shared under CC BY 4.0.
[[annotations]]
path = ["docs/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "doona contributors"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["site/fonts/*.woff2"]
precedence = "override"
SPDX-FileCopyrightText = "2023 Adobe"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["site/fonts/LICENSE-SourceSans3.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2010-2020 Adobe"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["site/fonts/LICENSE-SourceCodePro.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2010, 2012 Adobe Systems Incorporated"
SPDX-License-Identifier = "OFL-1.1"

# Spectrum icons copied from @react-spectrum/s2, as doona's are.
[[annotations]]
path = ["site/icons/spectrum.mjs"]
precedence = "override"
SPDX-FileCopyrightText = "2024 Adobe"
SPDX-License-Identifier = "Apache-2.0"

# Two Spectrum UI icons (LinkOut, Chevron) from @react-spectrum/s2 are inlined in these build files.
[[annotations]]
path = ["site/build/templates.mjs", "site/build/nav.mjs"]
precedence = "aggregate"
SPDX-FileCopyrightText = ["doona contributors", "2024 Adobe"]
SPDX-License-Identifier = "GPL-3.0-only AND Apache-2.0"

# Distribution logos from Simple Icons; the file names each logo's own licence where Simple Icons records one.
[[annotations]]
path = ["site/icons/distros.mjs"]
precedence = "override"
SPDX-FileCopyrightText = ["Simple Icons Collaborators", "Software in the Public Interest, Inc.", "Gentoo Foundation, Inc."]
SPDX-License-Identifier = "CC0-1.0 AND CC-BY-SA-3.0 AND CC-BY-SA-2.5"
