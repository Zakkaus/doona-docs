name: Docs

# Builds and checks the site against a doona checkout, which supplies the app's palette, sizes, icons and logo, and
# renders doona's screenshots into it for the site to publish under screenshots/. Pull requests stop there; main
# publishes the site to this repository's gh-pages branch, which GitHub Pages serves. The daily run picks up changes in
# doona and fails when doona moves an anchor the pages rely on.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      doona-ref:
        description: Branch, tag or commit of Zakkaus/doona to build against
        required: false

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DOONA_DIR: doona
      # doona's README links the screenshots on this site rather than keeping them in git. Publishing replaces the whole
      # site, so every run that can publish renders them; only pull requests check the pages without.
      SCREENSHOTS: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      # A release pins a tag through the DOONA_REF repository variable; otherwise doona's main.
      - uses: actions/checkout@v4
        with:
          repository: Zakkaus/doona
          ref: ${{ inputs.doona-ref || vars.DOONA_REF || 'main' }}
          path: doona
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            doona/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build doona
        if: env.SCREENSHOTS == 'true'
        working-directory: doona
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          echo "PLAYWRIGHT=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        if: env.SCREENSHOTS == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-shell-${{ env.PLAYWRIGHT }}
      # doona's CJK fonts are split into subsets that load with font-display: optional, so a subset that arrives late
      # falls back to the system font; the runner has no CJK font of its own.
      - name: Install Chromium, CJK fonts and the WebP tools
        if: env.SCREENSHOTS == 'true'
        working-directory: doona
        run: |
          pnpm exec playwright install --only-shell chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends webp fonts-noto-cjk
      # tools/screenshots.mjs signs in to the mock backend itself, against the build that e2e tests serve on 4177; it
      # writes docs/screenshots/, which the site build then publishes whole.
      - name: Render the screenshots
        if: env.SCREENSHOTS == 'true'
        working-directory: doona
        run: |
          pnpm exec vite preview --host 127.0.0.1 --port 4177 --strictPort > /dev/null &
          server=$!
          curl -sf --retry 30 --retry-delay 1 --retry-connrefused -o /dev/null http://127.0.0.1:4177/
          rm -rf docs/screenshots
          node tools/screenshots.mjs
          kill "$server"
      - run: pnpm test
      # The Markdown pages and llms.txt link by full URL on the published site.
      - run: pnpm docs:build
        env:
          DOCS_ORIGIN: https://zakkaus.github.io
      - run: pnpm docs:check
      # A publishing run without screenshots would replace the site and drop every image doona's README links.
      - name: Require the screenshots
        if: env.SCREENSHOTS == 'true'
        run: test -s doona/docs/screenshots/palettes.webp && test -s doona/docs/screenshots/en/activity-light.webp
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist-docs
          include-hidden-files: true

  publish:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      # One commit, force-pushed: the branch holds the current site and no history.
      - name: Push the site to gh-pages
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b gh-pages
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Publish the docs from ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
